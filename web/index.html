<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Virtual Financial Field Trips — First Community Bank</title>
    <meta name="description" content="A-Frame WebXR prototype: a bank lobby with teleport movement and an interactive ATM math scenario." />
    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Teleport locomotion (point a controller at the floor and release) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

    <style>
      /* 2D start / sign-in screen shown before entering the scene (desktop view). */
      #startScreen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 30%, #1b3a5c 0%, #0b1a2b 70%);
        color: #EAF6FF; font-family: system-ui, Arial, sans-serif; text-align: center;
      }
      #startScreen .logo { width: 64px; height: 64px; border-radius: 50%;
        background: #FFFFFF; display: flex; align-items: center; justify-content: center;
        margin-bottom: 18px; }
      #startScreen .logo span { color: #0B3D74; font-weight: 800; font-size: 30px; }
      #startScreen h1 { margin: 0 0 6px; font-size: 26px; }
      #startScreen h2 { margin: 0 0 24px; font-weight: 400; font-size: 16px; color: #AFC8E0; }
      #startScreen input { padding: 12px 14px; border-radius: 8px; border: none;
        font-size: 16px; width: 240px; margin-bottom: 14px; }
      #startScreen button { padding: 12px 26px; border-radius: 8px; border: none;
        background: #1F8A4C; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
      #startScreen button:hover { background: #25a259; }
      #startScreen .hint { margin-top: 22px; font-size: 13px; color: #88A6C4; max-width: 360px; }
    </style>

    <script>
      /* ---- Small custom components (plain JS, no extra dependencies) ---- */

      // Toggle a target entity's visibility when this entity is clicked.
      AFRAME.registerComponent('click-toggle', {
        schema: { target: { type: 'selector' } },
        init: function () {
          this.el.addEventListener('click', () => {
            const t = this.data.target;
            if (!t) return;
            t.setAttribute('visible', !t.getAttribute('visible'));
          });
        }
      });

      // Brighten a clickable object while the cursor/laser is over it.
      AFRAME.registerComponent('hover-highlight', {
        init: function () {
          const mesh = () => this.el.getObject3D('mesh');
          this.el.addEventListener('mouseenter', () => {
            const m = mesh(); if (m && m.material) m.material.emissive?.setHex(0x335577);
          });
          this.el.addEventListener('mouseleave', () => {
            const m = mesh(); if (m && m.material) m.material.emissive?.setHex(0x000000);
          });
        }
      });

      /*
        money-quiz: drives the ATM panel's intro -> question -> done flow.
        The MATH lives here (not in the markup), per docs/03-architecture.md, so
        it's easy to swap in new problems later. Logs attempts to the console as a
        stand-in for the future SessionLogger / teacher dashboard.
      */
      AFRAME.registerComponent('money-quiz', {
        schema: { correct: { type: 'number', default: 37.25 } },
        init: function () {
          this.attempts = 0;
          this.intro    = this.el.querySelector('#screen-intro');
          this.question = this.el.querySelector('#screen-question');
          this.done     = this.el.querySelector('#screen-done');
          this.hint     = this.el.querySelector('#hint');

          this.el.querySelector('#beginBtn').addEventListener('click', () => {
            this.intro.setAttribute('visible', false);
            this.question.setAttribute('visible', true);
          });

          this.el.querySelectorAll('.answer').forEach((btn) => {
            btn.addEventListener('click', () => this.choose(btn));
          });

          // Any element marked .close-panel hides the panel and resets the flow.
          this.el.querySelectorAll('.close-panel').forEach((b) => {
            b.addEventListener('click', () => {
              this.el.setAttribute('visible', false);
              this.reset();
            });
          });
        },
        choose: function (btn) {
          this.attempts++;
          const val = parseFloat(btn.getAttribute('data-value'));
          const isCorrect = Math.abs(val - this.data.correct) < 0.001;
          console.log('[quiz]', window.STUDENT_NAME || 'student', 'picked', val,
                      '| correct?', isCorrect, '| attempt', this.attempts);
          if (isCorrect) {
            this.question.setAttribute('visible', false);
            this.done.setAttribute('visible', true);
          } else {
            this.hint.setAttribute('value', 'Not quite. Line up the decimal points:\n50.00 - 12.75. Try again!');
            btn.setAttribute('color', '#B23A3A');
          }
        },
        reset: function () {
          this.attempts = 0;
          this.intro.setAttribute('visible', true);
          this.question.setAttribute('visible', false);
          this.done.setAttribute('visible', false);
          this.hint.setAttribute('value', '');
          this.el.querySelectorAll('.answer').forEach((b) => b.setAttribute('color', '#20486B'));
        }
      });

      /*
        deposit-station: the "make change & deposit" step at the teller.
        Student taps bills/coins to assemble an exact amount, then deposits it;
        the ledger (savings balance) updates. Money is tracked in CENTS to avoid
        floating-point rounding. Math/flow kept out of the markup per
        docs/03-architecture.md.
      */
      AFRAME.registerComponent('deposit-station', {
        schema: { target: { type: 'int', default: 3725 } }, // cents to assemble
        init: function () {
          this.stack = [];          // denominations added (cents)
          this.savings = 0;         // running ledger balance (cents)
          this.totalText = this.el.querySelector('#depTotal');
          this.feedback  = this.el.querySelector('#depFeedback');
          this.ledger    = this.el.querySelector('#ledgerBal');

          this.el.querySelectorAll('.denom').forEach((b) => {
            b.addEventListener('click', () => {
              this.stack.push(parseInt(b.getAttribute('data-cents'), 10));
              this.feedback.setAttribute('value', '');
              this.render();
            });
          });
          this.el.querySelector('#undoBtn').addEventListener('click', () => {
            this.stack.pop(); this.render();
          });
          this.el.querySelector('#depositBtn').addEventListener('click', () => this.deposit());
          this.render();
        },
        total: function () { return this.stack.reduce((a, b) => a + b, 0); },
        fmt: function (c) { return '$' + (c / 100).toFixed(2); },
        render: function () {
          this.totalText.setAttribute('value', 'Tray: ' + this.fmt(this.total()));
        },
        deposit: function () {
          const t = this.total();
          if (t === this.data.target) {
            this.savings += t;
            this.ledger.setAttribute('value', 'Savings: ' + this.fmt(this.savings));
            this.feedback.setAttribute('color', '#9CFFB0');
            this.feedback.setAttribute('value', 'Deposited ' + this.fmt(t) + '! Field trip complete.');
            console.log('[deposit]', window.STUDENT_NAME || 'student', 'deposited', t, 'cents');
            this.stack = []; this.render();
          } else {
            const diff = this.data.target - t;
            const msg = diff > 0 ? ('You have ' + this.fmt(t) + '. You need ' + this.fmt(diff) + ' more.')
                                 : ('That is ' + this.fmt(-diff) + ' too much. Tap UNDO.');
            this.feedback.setAttribute('color', '#FFD27F');
            this.feedback.setAttribute('value', msg);
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- ===================== START / SIGN-IN SCREEN ===================== -->
    <div id="startScreen">
      <div class="logo"><span>F</span></div>
      <h1>Virtual Financial Field Trips</h1>
      <h2>First Community Bank &middot; Grades 5–8</h2>
      <input id="studentName" type="text" placeholder="Enter your name" autocomplete="off" />
      <button id="enterBtn">Enter the Bank</button>
      <div class="hint">Desktop: drag to look, W/A/S/D to walk, click the ATM.<br/>
        Headset: point at the floor to teleport, point at the ATM and pull the trigger.</div>
    </div>

    <a-scene background="color: #11151b" shadow="type: pcf">

      <!-- ===================== 3D MODEL ASSETS ========================= -->
      <a-assets>
        <a-asset-item id="deskModel"   src="assets/models/vr_bank_teller_desk_counter.glb"></a-asset-item>
        <a-asset-item id="atmModel"    src="assets/models/vr_bank_atm.glb"></a-asset-item>
        <a-asset-item id="tellerModel" src="assets/models/vr_bank_teller_npc.glb"></a-asset-item>
      </a-assets>

      <!-- ============================ LIGHTING ============================ -->
      <a-light type="ambient" color="#9aa3ad" intensity="0.75"></a-light>
      <!-- Sun through the entrance glass; casts soft shadows -->
      <a-light type="directional" color="#FFF6E8" intensity="0.7"
               position="5 6 9" castShadow="true"
               light="shadowMapWidth: 1024; shadowMapHeight: 1024"></a-light>
      <a-light type="point" color="#FFFFFF" intensity="0.35" position="0 3 -5"></a-light>
      <a-light type="point" color="#FFFFFF" intensity="0.30" position="0 3 2"></a-light>

      <!-- ============================ SHELL ============================== -->
      <!-- Carpet floor -->
      <a-plane class="ground" rotation="-90 0 0" width="12" height="16" position="0 0 -2"
               color="#3c4149" roughness="1" shadow="receive: true"></a-plane>
      <!-- A lighter walkway runner down the middle -->
      <a-plane class="ground" rotation="-90 0 0" width="2.4" height="14" position="0 0.01 -2"
               color="#4d535c" roughness="1"></a-plane>

      <!-- Ceiling -->
      <a-plane rotation="90 0 0" width="12" height="16" position="0 3.2 -2" color="#e9ebee"></a-plane>
      <!-- Recessed ceiling light panels (emissive) -->
      <a-plane rotation="90 0 0" width="1.4" height="1.4" position="-2.5 3.18 -5" color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.9; shader: flat"></a-plane>
      <a-plane rotation="90 0 0" width="1.4" height="1.4" position="2.5 3.18 -5"  color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.9; shader: flat"></a-plane>
      <a-plane rotation="90 0 0" width="1.4" height="1.4" position="-2.5 3.18 0"  color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.9; shader: flat"></a-plane>
      <a-plane rotation="90 0 0" width="1.4" height="1.4" position="2.5 3.18 0"   color="#FFFFFF" material="emissive: #FFFFFF; emissiveIntensity: 0.9; shader: flat"></a-plane>

      <!-- Back wall + deep-blue accent panel with branding -->
      <a-box position="0 1.6 -10" width="12" height="3.2" depth="0.2" color="#d7dbe0"></a-box>
      <a-box position="0 1.85 -9.88" width="7" height="2.1" depth="0.06" color="#0B3D74"></a-box>
      <a-circle position="-2.2 2.25 -9.84" radius="0.32" color="#FFFFFF"></a-circle>
      <a-text value="F" align="center" color="#0B3D74" width="6" position="-2.2 2.25 -9.82"></a-text>
      <a-text value="FIRST COMMUNITY BANK" align="left" color="#FFFFFF" width="6.5"
              position="-1.7 2.3 -9.82" anchor="left"></a-text>
      <a-text value="Member FDIC" align="left" color="#AFC8E0" width="3"
              position="-1.7 1.95 -9.82" anchor="left"></a-text>

      <!-- Side walls -->
      <a-box position="-6 1.6 -2" width="0.2" height="3.2" depth="16" color="#cfd4da"></a-box>
      <a-box position="6 1.6 -2"  width="0.2" height="3.2" depth="16" color="#cfd4da"></a-box>

      <!-- Front wall = glass entrance.  Dark frame mullions + tinted glass + daylight -->
      <a-box position="0 1.6 6" width="12" height="0.2" depth="0.2" color="#2a2e35"></a-box> <!-- top frame -->
      <a-box position="-4 1.6 6" width="0.15" height="3.2" depth="0.2" color="#2a2e35"></a-box>
      <a-box position="0 1.6 6"  width="0.15" height="3.2" depth="0.2" color="#2a2e35"></a-box>
      <a-box position="4 1.6 6"  width="0.15" height="3.2" depth="0.2" color="#2a2e35"></a-box>
      <a-plane position="0 1.6 5.98" width="11.6" height="3.0"
               material="color: #cfe8f5; opacity: 0.22; transparent: true; metalness: 0.1; roughness: 0.05"></a-plane>
      <!-- Daylight beyond the glass -->
      <a-plane position="0 2 7.2" width="14" height="6"
               material="color: #d8ecff; emissive: #d8ecff; emissiveIntensity: 0.6; shader: flat"></a-plane>

      <!-- ============= RECEPTION DESK + TELLER (3D models) ============= -->
      <!-- If a model faces away from the player, flip its rotation Y by 180. -->
      <a-entity gltf-model="#deskModel"   position="0 0 -6.7" rotation="0 0 0" shadow="cast: true"></a-entity>
      <a-entity gltf-model="#tellerModel" position="0 0 -7.5" rotation="0 0 0" shadow="cast: true"></a-entity>

      <!-- ============== DEPOSIT STATION (make change step) ============= -->
      <a-entity id="depositStation" deposit-station="target: 3725" position="0 1.55 -5.85">
        <a-plane width="3.2" height="2.2" color="#0F2230" opacity="0.95" material="shader: flat"></a-plane>
        <a-text value="TELLER - MAKE YOUR DEPOSIT" align="center" color="#9FE3FF" width="3.4" position="0 0.92 0.02"></a-text>
        <a-text width="3.0" align="center" color="#EAF6FF" position="0 0.64 0.02"
                value="Tap bills and coins to build $37.25,\nthen press DEPOSIT."></a-text>

        <!-- denominations (cents) -->
        <a-plane class="clickable denom" hover-highlight data-cents="2000" color="#1F6FB2"
                 width="0.56" height="0.34" position="-1.16 0.26 0.02"
                 text="value: $20; align: center; color: #FFFFFF; width: 1.6"></a-plane>
        <a-plane class="clickable denom" hover-highlight data-cents="1000" color="#1F6FB2"
                 width="0.56" height="0.34" position="-0.58 0.26 0.02"
                 text="value: $10; align: center; color: #FFFFFF; width: 1.6"></a-plane>
        <a-plane class="clickable denom" hover-highlight data-cents="500" color="#1F6FB2"
                 width="0.56" height="0.34" position="0 0.26 0.02"
                 text="value: $5; align: center; color: #FFFFFF; width: 1.6"></a-plane>
        <a-plane class="clickable denom" hover-highlight data-cents="100" color="#1F6FB2"
                 width="0.56" height="0.34" position="0.58 0.26 0.02"
                 text="value: $1; align: center; color: #FFFFFF; width: 1.6"></a-plane>
        <a-plane class="clickable denom" hover-highlight data-cents="25" color="#2E7D32"
                 width="0.56" height="0.34" position="1.16 0.26 0.02"
                 text="value: 25c; align: center; color: #FFFFFF; width: 1.6"></a-plane>

        <a-text id="depTotal" value="Tray: $0.00" align="center" color="#FFE9A8" width="3.0" position="0 -0.06 0.02"></a-text>

        <a-plane id="undoBtn" class="clickable" hover-highlight color="#6b4a2f"
                 width="0.95" height="0.32" position="-0.62 -0.46 0.02"
                 text="value: UNDO; align: center; color: #FFFFFF; width: 2"></a-plane>
        <a-plane id="depositBtn" class="clickable" hover-highlight color="#1F8A4C"
                 width="0.95" height="0.32" position="0.62 -0.46 0.02"
                 text="value: DEPOSIT; align: center; color: #FFFFFF; width: 2"></a-plane>

        <a-text id="depFeedback" value="" align="center" color="#FFD27F" width="3.0" position="0 -0.78 0.02"></a-text>
        <a-text id="ledgerBal" value="Savings: $0.00" align="center" color="#9FE3FF" width="3.0" position="0 -0.98 0.02"></a-text>
      </a-entity>

      <!-- ===================== ATM (3D model) ========================= -->
      <!-- Against the right wall, front turned toward the room (-X). -->
      <a-entity gltf-model="#atmModel" position="5.65 0 -3" rotation="0 -90 0" shadow="cast: true"></a-entity>
      <!-- Invisible-ish clickable target over the ATM screen (opens the panel) -->
      <a-plane id="atm" class="clickable" hover-highlight click-toggle="target: #atmPanel"
               position="5.42 1.45 -3" rotation="0 -90 0" width="0.6" height="0.46"
               material="color: #1E5FA8; opacity: 0.18; transparent: true"></a-plane>

      <!-- ======================= WELCOME KIOSKS ======================== -->
      <a-entity position="-4.6 0 0.5" rotation="0 35 0">
        <a-box position="0 1.0 0" width="0.7" height="2.0" depth="0.08" color="#0B5CAB" shadow="cast: true"></a-box>
        <a-text value="WELCOME" align="center" color="#FFFFFF" width="1.8" position="0 1.55 0.05"></a-text>
        <a-text value="Step up to\nthe teller or\nthe ATM" align="center" color="#dbeaff" width="1.4" position="0 1.0 0.05"></a-text>
      </a-entity>

      <!-- ============================ PLANTS =========================== -->
      <a-entity position="-5.2 0 -9">
        <a-cylinder position="0 0.25 0" radius="0.22" height="0.5" color="#5b4636"></a-cylinder>
        <a-sphere position="0 0.85 0" radius="0.45" color="#2f6b3a"></a-sphere>
      </a-entity>
      <a-entity position="5.2 0 3.5">
        <a-cylinder position="0 0.25 0" radius="0.22" height="0.5" color="#5b4636"></a-cylinder>
        <a-sphere position="0 0.85 0" radius="0.45" color="#356f40"></a-sphere>
      </a-entity>

      <!-- =================== WORLD-SPACE ATM PANEL ===================== -->
      <a-entity id="atmPanel" visible="false" money-quiz="correct: 37.25" position="4.95 1.6 -3" rotation="0 -90 0">
        <a-plane width="2.4" height="1.8" color="#0F2230" opacity="0.96" material="shader: flat"></a-plane>

        <a-plane class="clickable close-panel" hover-highlight color="#1F6FB2"
                 width="0.22" height="0.22" position="1.05 0.78 0.03"
                 text="value: X; align: center; color: #FFFFFF; width: 1.4"></a-plane>

        <!-- Screen 1: intro -->
        <a-entity id="screen-intro" position="0 0 0.03">
          <a-text value="WELCOME TO THE ATM" align="center" color="#9FE3FF" width="2.4" position="0 0.66 0"></a-text>
          <a-text width="2.2" align="center" color="#EAF6FF" position="0 0.12 0"
                  value="You earned $50.00 mowing lawns.\nYou owe the bank $12.75.\n\nLet's figure out what's left."></a-text>
          <a-plane id="beginBtn" class="clickable" hover-highlight color="#1F8A4C"
                   width="1.0" height="0.32" position="0 -0.58 0"
                   text="value: BEGIN; align: center; color: #FFFFFF; width: 2"></a-plane>
        </a-entity>

        <!-- Screen 2: the question -->
        <a-entity id="screen-question" visible="false" position="0 0 0.03">
          <a-text width="2.2" align="center" color="#EAF6FF" position="0 0.66 0"
                  value="You have $50.00 and pay $12.75.\nHow much do you have left?"></a-text>
          <a-plane class="clickable answer" hover-highlight data-value="37.25" color="#20486B"
                   width="1.0" height="0.32" position="-0.58 0.18 0"
                   text="value: $37.25; align: center; color: #FFFFFF; width: 2"></a-plane>
          <a-plane class="clickable answer" hover-highlight data-value="38.25" color="#20486B"
                   width="1.0" height="0.32" position="0.58 0.18 0"
                   text="value: $38.25; align: center; color: #FFFFFF; width: 2"></a-plane>
          <a-plane class="clickable answer" hover-highlight data-value="37.75" color="#20486B"
                   width="1.0" height="0.32" position="-0.58 -0.20 0"
                   text="value: $37.75; align: center; color: #FFFFFF; width: 2"></a-plane>
          <a-plane class="clickable answer" hover-highlight data-value="47.25" color="#20486B"
                   width="1.0" height="0.32" position="0.58 -0.20 0"
                   text="value: $47.25; align: center; color: #FFFFFF; width: 2"></a-plane>
          <a-text id="hint" width="2.2" align="center" color="#FFD27F" position="0 -0.66 0" value=""></a-text>
        </a-entity>

        <!-- Screen 3: success / debrief -->
        <a-entity id="screen-done" visible="false" position="0 0 0.03">
          <a-text value="Correct! Nice work." align="center" color="#9CFFB0" width="2.4" position="0 0.6 0"></a-text>
          <a-text width="2.2" align="center" color="#EAF6FF" position="0 0.0 0"
                  value="You used decimal subtraction:\n$50.00 - $12.75 = $37.25.\n\nNow step to the teller and deposit\nyour $37.25 into savings."></a-text>
          <a-plane class="clickable close-panel" hover-highlight color="#1F6FB2"
                   width="1.0" height="0.32" position="0 -0.62 0"
                   text="value: DONE; align: center; color: #FFFFFF; width: 2"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ========================= PLAYER RIG ========================== -->
      <a-entity id="rig" position="0 0 3.5">
        <a-camera id="camera" position="0 1.6 0" wasd-controls="acceleration: 30" look-controls></a-camera>
        <a-entity id="leftHand" laser-controls="hand: left"
                  raycaster="objects: .clickable; far: 14"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .ground; buttons: trigger, thumbstick"></a-entity>
        <a-entity id="rightHand" laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 14"
                  blink-controls="cameraRig: #rig; teleportOrigin: #camera; collisionEntities: .ground; buttons: trigger, thumbstick"></a-entity>
      </a-entity>

      <!-- Desktop: mouse acts as the pointer for clicking .clickable objects -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 30"></a-entity>

    </a-scene>

    <script>
      // Wire the start screen: capture the student's name, then reveal the scene.
      (function () {
        const start = document.getElementById('startScreen');
        const btn = document.getElementById('enterBtn');
        const nameInput = document.getElementById('studentName');
        function enter() {
          window.STUDENT_NAME = (nameInput.value || '').trim() || 'student';
          console.log('[session] entered as', window.STUDENT_NAME);
          start.style.display = 'none';
        }
        btn.addEventListener('click', enter);
        nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
      })();
    </script>
  </body>
</html>
